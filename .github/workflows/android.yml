name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Copy web app
        run: npm run web

      - name: Create Android project
        run: npx cap add android && npx cap sync android

      - name: App icon, version, fullscreen
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android-res/ic_launcher-$d.png $RES/mipmap-$d/ic_launcher.png
            cp android-res/ic_launcher-$d.png $RES/mipmap-$d/ic_launcher_round.png
            rm -f $RES/mipmap-$d/ic_launcher_foreground.png
          done
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          # Hide status and navigation bars (immersive) for playing
          sed -i 's|parent="Theme.AppCompat.DayNight.NoActionBar"|parent="Theme.AppCompat.NoActionBar"|' $RES/values/styles.xml
          sed -i 's|<item name="windowActionBar">false</item>|<item name="windowActionBar">false</item>\n        <item name="android:windowFullscreen">true</item>|' $RES/values/styles.xml

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk Melasa-$VERSION.apk

      - uses: actions/upload-artifact@v4
        with:
          name: melasa-apk
          path: Melasa-*.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Melasa-*.apk
          prerelease: true
          name: Melasa ${{ github.ref_name }}
          body: |
            First alpha of Melasa: touch drums and piano.

            - Drums: Black Pearl, Red Zeppelin, TR-808, Synth, each with its own skin
            - Pianos: Grand, Upright, Honky-tonk, each with its own skin
            - Adjustable drum layout, open/closed hi-hat, sustain, octave shift
            - Works offline

            Install: download the APK on your Android phone and open it. Android will ask you to allow installs from your browser or file app the first time.
