name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Copy web app
        run: npm run web

      - name: Create Android project
        run: npx cap add android && npx cap sync android

      - name: Add native sound engine
        run: bash android-native/apply.sh

      - name: App icon, version, fullscreen
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android-res/ic_launcher-$d.png $RES/mipmap-$d/ic_launcher.png
            cp android-res/ic_launcher-$d.png $RES/mipmap-$d/ic_launcher_round.png
            rm -f $RES/mipmap-$d/ic_launcher_foreground.png
          done
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          # Hide status and navigation bars (immersive) for playing
          sed -i 's|parent="Theme.AppCompat.DayNight.NoActionBar"|parent="Theme.AppCompat.NoActionBar"|' $RES/values/styles.xml
          sed -i 's|<item name="windowActionBar">false</item>|<item name="windowActionBar">false</item>\n        <item name="android:windowFullscreen">true</item>|' $RES/values/styles.xml

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash android-native/smoke.sh

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/debug/app-debug.apk Melasa-$VERSION.apk

      - uses: actions/upload-artifact@v4
        with:
          name: melasa-apk
          path: Melasa-*.apk

      # Runs on a v* tag, or when started by hand (then it tags v<package.json version>)
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: Melasa-*.apk
          prerelease: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          target_commitish: ${{ github.sha }}
          name: Melasa ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          body: |
            Melasa alpha: touch drums and piano.

            - Native low-latency sound engine on Android (switchable in Credits)
            - Every finger is tracked on its own: hold one pad and hit others, alternate both kick pads for double pedal
            - Drums: Black Pearl, Red Zeppelin, TR-808, Synth; pianos: Grand, Upright, Honky-tonk
            - Adjustable drum layout, skins, open/closed hi-hat, sustain, octave shift

            Install: download the APK on your Android phone and open it. It installs over the previous version.
