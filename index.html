<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14110f">
<!--ARTIFACT-START-->
<title>Melasa Drums</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&display=swap">
<style>
  /* Layout: full-screen stage, pads placed like a kit seen from the throne (landscape + portrait maps). */
  :root {
    --stage: #14110f;
    --stage-glow: #2a221c;
    --head: #ece6da;
    --head-edge: #c9bfae;
    --hoop: #8a2b22;
    --brass: #c99a3e;
    --brass-dark: #7a5a1c;
    --ink: #f3ece0;
    --ink-dim: #9c8f7d;
    --font-label: "Saira Condensed", "Arial Narrow", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 60%, var(--stage-glow), var(--stage) 70%);
    background-color: var(--stage);
    color: var(--ink);
    font-family: var(--font-label);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  #stage { position: fixed; inset: 0; }

  .brand {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    font-size: 13px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--ink-dim);
    pointer-events: none;
  }

  .pad {
    position: absolute;
    left: calc(var(--lx) * 1%);
    top: calc(var(--ly) * 1%);
    width: calc(var(--ls) * 1vmin);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: grid; place-items: center;
    cursor: pointer;
    touch-action: none;
    transition: transform 90ms ease-out, filter 90ms ease-out;
  }
  @media (orientation: portrait) {
    .pad {
      left: calc(var(--px) * 1%);
      top: calc(var(--py) * 1%);
      width: calc(var(--ps) * 1vmin);
    }
  }
  .pad span {
    font-size: clamp(11px, 2.4vmin, 16px);
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* Drum heads: coated head, colored hoop */
  .drum {
    background: radial-gradient(circle at 45% 40%, var(--head) 0 55%, var(--head-edge) 70%);
    box-shadow: 0 0 0 calc(var(--ls) * .045vmin) var(--hoop), 0 8px 18px rgba(0,0,0,.55);
  }
  .drum span { color: #4a3f33; }
  .kick { --hoop: #3b4a5a; }
  .kick { background: radial-gradient(circle at 45% 40%, #2b2622 0 50%, #1b1714 72%); }
  .kick span { color: var(--ink-dim); }

  /* Cymbals: brass with lathe grooves and a bell */
  .cym {
    background:
      radial-gradient(circle, var(--brass) 0 9%, var(--brass-dark) 10% 11%, transparent 12%),
      repeating-radial-gradient(circle, rgba(255,240,200,.08) 0 2px, rgba(0,0,0,.08) 2px 4px),
      radial-gradient(circle at 40% 35%, #e6c374, var(--brass) 45%, var(--brass-dark));
    box-shadow: 0 8px 20px rgba(0,0,0,.55);
  }
  .cym span { color: #3a2a0c; transform: translateY(calc(var(--ls) * .22vmin)); }

  .pad.hit { transform: translate(-50%, -50%) scale(.94); filter: brightness(1.25); transition: none; }
  .cym.hit { transform: translate(-50%, -50%) scale(.96) rotate(4deg); }

  /* Edit layout mode */
  .tools {
    position: fixed; z-index: 4;
    top: calc(8px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    display: flex; gap: 8px;
  }
  .tools button {
    font: 700 13px var(--font-label); letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink); background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18); border-radius: 6px;
    padding: 8px 12px; cursor: pointer;
  }
  .tools button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .tools .primary { background: var(--brass); color: #2a1d06; border-color: var(--brass); }
  body.editing .pad { outline: 2px dashed rgba(243,236,224,.55); outline-offset: 4px; cursor: grab; }
  body.editing .pad.dragging { cursor: grabbing; filter: brightness(1.15); z-index: 2; }
  .grip {
    display: none;
    position: absolute; right: 2%; bottom: 2%;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--ink); border: 3px solid var(--stage);
    cursor: nwse-resize; touch-action: none;
  }
  body.editing .grip { display: block; }
  .hint {
    position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    font-size: 13px; letter-spacing: .08em; color: var(--ink-dim);
    pointer-events: none;
  }

  #start {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: rgba(20,17,15,.82);
    z-index: 5;
    border: 0; width: 100%;
    color: var(--ink);
    font: 700 clamp(20px, 5vmin, 34px) var(--font-label);
    letter-spacing: .2em; text-transform: uppercase;
    cursor: pointer;
  }
  #start small { display: block; margin-top: 8px; font-size: 13px; font-weight: 500; color: var(--ink-dim); letter-spacing: .1em; }
  #start:focus-visible { outline: 2px solid var(--brass); outline-offset: -6px; }
  @media (prefers-reduced-motion: reduce) { .pad, .pad.hit { transition: none; } .cym.hit { transform: translate(-50%, -50%) scale(.96); } }
</style>
</head>
<body>
<div id="stage">
  <!-- data: id, label, class, landscape x/y/size, portrait x/y/size -->
  <div class="pad cym"  data-snd="crash"  style="--lx:23;--ly:22;--ls:32;--px:25;--py:12;--ps:36"><span>Crash</span></div>
  <div class="pad cym"  data-snd="splash" style="--lx:43;--ly:13;--ls:22;--px:50;--py:27;--ps:22"><span>Splash</span></div>
  <div class="pad cym"  data-snd="ride"   style="--lx:80;--ly:22;--ls:38;--px:74;--py:14;--ps:40"><span>Ride</span></div>
  <div class="pad cym"  data-snd="hhopen" style="--lx:10;--ly:32;--ls:24;--px:14;--py:31;--ps:24"><span>HH open</span></div>
  <div class="pad cym"  data-snd="hihat"  style="--lx:10;--ly:62;--ls:24;--px:14;--py:44;--ps:24"><span>HH closed</span></div>
  <div class="pad drum" data-snd="tom1"   style="--lx:40;--ly:42;--ls:24;--px:45;--py:45;--ps:26"><span>Tom 1</span></div>
  <div class="pad drum" data-snd="tom2"   style="--lx:58;--ly:40;--ls:24;--px:72;--py:42;--ps:26"><span>Tom 2</span></div>
  <div class="pad drum" data-snd="tom3"   style="--lx:77;--ly:70;--ls:32;--px:74;--py:62;--ps:34"><span>Floor</span></div>
  <div class="pad drum" data-snd="snare"  style="--lx:26;--ly:68;--ls:30;--px:28;--py:60;--ps:32"><span>Snare</span></div>
  <div class="pad drum kick" data-snd="kick" style="--lx:45;--ly:85;--ls:26;--px:32;--py:82;--ps:30"><span>Kick L</span></div>
  <div class="pad drum kick" data-snd="kick" style="--lx:61;--ly:85;--ls:26;--px:68;--py:82;--ps:30"><span>Kick R</span></div>
</div>
<div class="brand">Melasa</div>
<div class="tools">
  <button id="edit" type="button">Edit layout</button>
  <button id="done" type="button" class="primary" hidden>Done</button>
  <button id="reset" type="button" hidden>Reset</button>
</div>
<div class="hint" id="hint" hidden>Drag pads to move. Drag the dot to resize.</div>
<button id="start" type="button">Tap to play<small>Turn off silent mode for sound</small></button>

<script>
/* ---------- Audio engine (synthesized, no samples) ---------- */
const Engine = (() => {
  let ctx, out, noiseBuf;

  function init() {
    if (ctx) { if (ctx.state !== 'running') ctx.resume(); return; }
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -10; comp.ratio.value = 4;
    out = ctx.createGain(); out.gain.value = 0.9;
    out.connect(comp).connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  function env(peak, t, decay, attack = 0.001) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    g.connect(out);
    return g;
  }

  function noise(t, dur, dest) {
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    s.connect(dest);
    s.start(t, Math.random() * 1.5);
    s.stop(t + dur);
  }

  function filter(type, freq, q = 1) {
    const f = ctx.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    return f;
  }

  function kick(v, t) {
    const o = ctx.createOscillator();
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    o.connect(env(v, t, 0.45));
    o.start(t); o.stop(t + 0.5);
    const lp = filter('lowpass', 3000); lp.connect(env(v * 0.4, t, 0.012));
    noise(t, 0.02, lp);
  }

  function snare(v, t) {
    const o = ctx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(170, t + 0.05);
    o.connect(env(v * 0.6, t, 0.1));
    o.start(t); o.stop(t + 0.15);
    const hp = filter('highpass', 1400); hp.connect(env(v * 0.9, t, 0.2));
    noise(t, 0.25, hp);
  }

  function tom(f, v, t) {
    const o = ctx.createOscillator();
    o.frequency.setValueAtTime(f * 1.6, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.06);
    const decay = 0.35 + 30 / f;
    o.connect(env(v, t, decay));
    o.start(t); o.stop(t + decay + 0.05);
    const lp = filter('lowpass', f * 8); lp.connect(env(v * 0.25, t, 0.05));
    noise(t, 0.06, lp);
  }

  // 808-style metal: stacked square waves at inharmonic ratios
  const RATIOS = [2, 3, 4.16, 5.43, 6.79, 8.21];
  function metal(v, t, { decay, bp, hp = 7000, base = 40, noiseAmt = 0, attack = 0.001 }) {
    const band = filter('bandpass', bp, 0.8);
    const high = filter('highpass', hp);
    const gains = [env(v, t, decay, attack)];
    band.connect(high); high.connect(gains[0]);
    RATIOS.forEach(r => {
      const o = ctx.createOscillator(); o.type = 'square';
      o.frequency.value = base * r;
      o.connect(band);
      o.start(t); o.stop(t + attack + decay + 0.05);
    });
    if (noiseAmt) {
      const nh = filter('highpass', hp - 1500);
      const ng = env(v * noiseAmt, t, decay * 0.8, attack);
      gains.push(ng); nh.connect(ng);
      noise(t, decay + 0.1, nh);
    }
    return gains;
  }

  // Closing the hi-hat chokes a ringing open hat
  let openHat = [];
  function choke(t) {
    openHat.forEach(g => { g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03); });
    openHat = [];
  }

  const sounds = {
    kick:   (v, t) => kick(v, t),
    snare:  (v, t) => snare(v, t),
    tom1:   (v, t) => tom(200, v, t),
    tom2:   (v, t) => tom(150, v, t),
    tom3:   (v, t) => tom(95, v, t),
    hihat:  (v, t) => { choke(t); metal(v * 0.5, t, { decay: 0.06, bp: 10000 }); },
    hhopen: (v, t) => { choke(t); openHat = metal(v * 0.45, t, { decay: 0.9, bp: 10000, noiseAmt: 0.5 }); },
    splash: (v, t) => metal(v * 0.45, t, { decay: 0.6, bp: 9000, noiseAmt: 0.8 }),
    crash:  (v, t) => metal(v * 0.5, t, { decay: 1.8, bp: 8000, hp: 6000, noiseAmt: 1.2, attack: 0.004 }),
    ride:   (v, t) => metal(v * 0.4, t, { decay: 1.3, bp: 6500, hp: 4500, base: 52, noiseAmt: 0.3 }),
  };

  function play(name, v = 1) {
    if (!ctx) init();
    sounds[name](Math.max(0.05, Math.min(1, v)), ctx.currentTime + 0.005);
  }

  return { init, play };
})();

/* ---------- Touch handling (multi-touch via pointer events) ---------- */
const start = document.getElementById('start');
start.addEventListener('pointerdown', e => { e.preventDefault(); Engine.init(); start.hidden = true; });
start.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { Engine.init(); start.hidden = true; } });

document.querySelectorAll('.pad').forEach(pad => {
  pad.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (editing) return;
    // Velocity: center hits are louder, rim hits softer
    const r = pad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    const dist = Math.min(1, Math.hypot(dx, dy) / (r.width / 2));
    Engine.play(pad.dataset.snd, 1 - dist * 0.45);
    pad.classList.remove('hit'); void pad.offsetWidth; pad.classList.add('hit');
    clearTimeout(pad._t); pad._t = setTimeout(() => pad.classList.remove('hit'), 90);
  });
});
/* ---------- Adjustable layout (saved per orientation on this device) ---------- */
const pads = [...document.querySelectorAll('.pad')];
const STORE = 'melasa-layout-v1';
const VARS = ['lx', 'ly', 'ls', 'px', 'py', 'ps'];
const defaults = pads.map(p => Object.fromEntries(VARS.map(k => [k, +p.style.getPropertyValue('--' + k)])));
let editing = false;

function applyLayout(layout) {
  pads.forEach((p, i) => VARS.forEach(k => { if (layout[i] && layout[i][k] != null) p.style.setProperty('--' + k, layout[i][k]); }));
}
function currentLayout() {
  return pads.map(p => Object.fromEntries(VARS.map(k => [k, +p.style.getPropertyValue('--' + k)])));
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(currentLayout())); } catch (e) {} }
try { const saved = JSON.parse(localStorage.getItem(STORE)); if (Array.isArray(saved)) applyLayout(saved); } catch (e) {}

const isPortrait = () => matchMedia('(orientation: portrait)').matches;
const keys = () => isPortrait() ? ['px', 'py', 'ps'] : ['lx', 'ly', 'ls'];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function setEditing(on) {
  editing = on;
  document.body.classList.toggle('editing', on);
  document.getElementById('edit').hidden = on;
  document.getElementById('done').hidden = !on;
  document.getElementById('reset').hidden = !on;
  document.getElementById('hint').hidden = !on;
  if (!on) save();
}
document.getElementById('edit').addEventListener('click', () => setEditing(true));
document.getElementById('done').addEventListener('click', () => setEditing(false));
document.getElementById('reset').addEventListener('click', () => {
  applyLayout(defaults);
  try { localStorage.removeItem(STORE); } catch (e) {}
});

pads.forEach(pad => {
  const grip = document.createElement('div');
  grip.className = 'grip';
  pad.appendChild(grip);

  let mode = null, offX = 0, offY = 0;
  pad.addEventListener('pointerdown', e => {
    if (!editing) return;
    pad.setPointerCapture(e.pointerId);
    const r = pad.getBoundingClientRect();
    mode = e.target === grip ? 'resize' : 'move';
    offX = e.clientX - (r.left + r.width / 2);
    offY = e.clientY - (r.top + r.height / 2);
    pad.classList.add('dragging');
  });
  pad.addEventListener('pointermove', e => {
    if (!mode) return;
    const [kx, ky, ks] = keys();
    const W = innerWidth, H = innerHeight, vmin = Math.min(W, H) / 100;
    if (mode === 'move') {
      pad.style.setProperty('--' + kx, clamp((e.clientX - offX) / W * 100, 0, 100).toFixed(1));
      pad.style.setProperty('--' + ky, clamp((e.clientY - offY) / H * 100, 0, 100).toFixed(1));
    } else {
      const r = pad.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const d = Math.hypot(e.clientX - cx, e.clientY - cy) * 2 / Math.SQRT2 * 1.0;
      pad.style.setProperty('--' + ks, clamp(d / vmin, 12, 70).toFixed(1));
    }
  });
  const end = () => { if (mode) { mode = null; pad.classList.remove('dragging'); save(); } };
  pad.addEventListener('pointerup', end);
  pad.addEventListener('pointercancel', end);
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

/* Keyboard for desktop testing */
const KEYS = { z: 'hhopen', a: 'hihat', s: 'snare', d: 'tom1', f: 'tom2', g: 'tom3', ' ': 'kick', q: 'crash', w: 'splash', e: 'ride' };
document.addEventListener('keydown', e => {
  const snd = KEYS[e.key.toLowerCase()];
  if (snd && !e.repeat) { Engine.init(); start.hidden = true; Engine.play(snd, 0.9); }
});
</script>
<!--ARTIFACT-END-->
</body>
</html>
